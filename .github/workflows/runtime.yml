name: CPU runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned official Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Release replay and bounded benchmark parity gate
        run: |
          cargo run --release --locked -- run --bunches 12 --steps 3000 > /tmp/lhc.receipt
          cargo run --release --locked -- replay /tmp/lhc.receipt
          cargo run --release --locked -- replay tests/fixtures/cpu-v1/fill-12.receipt
          cargo run --release --locked -- bench
